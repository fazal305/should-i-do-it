<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Should I Do It?</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">
    <section class="hero">
      <p class="tagline">Late night decision energy</p>

      <h1>Should I Do It?</h1>

      <p class="description">
        Type your question and let the universe give you a very questionable answer.
      </p>
    </section>

    <section class="decision-card">
      <label for="questionInput">Ask your question</label>

      <input
        type="text"
        id="questionInput"
        placeholder="Should I order biryani at 2 AM?"
      />

      <button id="decideBtn">
        Decide My Fate
      </button>

      <div id="resultBox" class="result-box">
        Your answer will appear here...
      </div>

      <div class="action-buttons">
        <button id="askAgainBtn" class="secondary-btn">
          Ask Again
        </button>

        <a id="whatsappShareBtn" class="secondary-btn" href="#" target="_blank">
          Share on WhatsApp
        </a>
      </div>
    </section>

    <section class="history-section">
      <h2>Recent Decisions</h2>

      <ul id="historyList">
        <!-- Last 5 questions and answers will appear here using JavaScript -->
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
